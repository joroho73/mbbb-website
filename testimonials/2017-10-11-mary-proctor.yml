reviewer: Mary Proctor
review_text: As I am 88yrs old, my daughter brings me to your events. I try to
  go to as many as I can and have seen you a number of times but I thought I
  would let you know that the concert at the Brentwood Theatre in October was
  wonderful. I thoroughly enjoyed it and because I was in a wheelchair, I was
  right at the front and was able to see the musicians play. The pianist was
  such a joy to watch and it was so interesting seeing him play. You could see
  he was enjoying himself as were the other musicians. The music played was
  slightly different to the usual but really interesting and took me back to my
  youth! The conductor even played my favourite number, which just made my day!
  Thank you so much. I hope to see you at your Christmas concert!
date: 2017-10-11
