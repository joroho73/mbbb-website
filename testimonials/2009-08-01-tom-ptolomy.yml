reviewer: Tom Ptolomy
review_text: >-
  Thanks so much to you and the whole band for putting on such a fabulous
  performance and making our ‘wedding in a field’ so special! 


  At least the weather was with us this time. The band are not only a great
  performance but great company, you all help make it personal and special.
  We’ve now celebrated four of our largest family events (birthdays, namings and
  weddings). See you next year for my 40th!!! 


  Thanks again, it really was great and you all come highly recommended by us!
