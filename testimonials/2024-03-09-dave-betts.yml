reviewer: Dave Betts
review_text: >-
  The Melvin Beddow Big Band really made my 70th birthday party go with a
  swing! 


  They played all the big band favourites such as “Moonlight Serenade” and “In
  the Mood” and had everyone up dancing later on, with numbers such as “Happy”
  and “Uptown Funk”. Their vocalist was superb and bandleader Steve was really
  entertaining, especially the audience participation pieces. I couldn’t fault
  the musicianship.


  The guests were amazed that we had a big band to play for us instead of the
  usual disco and all commented on what a wonderful evening it had been.


  Highly recommended.
