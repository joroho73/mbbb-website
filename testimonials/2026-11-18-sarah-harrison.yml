reviewer: Sarah Harrison
review_text: >-
  Thank you to the Band for a wonderful evening of music and dancing. 


  You made our surprise party for my father fantastic. He was so shocked to see
  a large Big Band playing music that he loves and enjoys, ranging from modern
  day tunes, to Frank Sinatra.


  Every one of our friends and relations enjoyed all aspects of the evening, and
  everyone was dancing. All we needed were some judges, and we would have had
  our own Strictly Come Dancing.


  I would definitely recommend your band to anyone who loves the Big Band sound
  and a great night of live entertainment and dancing to suit any occasion,
  young and old. Brilliant!
