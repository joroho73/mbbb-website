reviewer: Gloria Nichols
review_text: >-
  Many, many thanks for an excellent evening on Saturday night at Dunston Hall
  for the Rotary Conference Dinner 2013. The evening went with a swing from the
  moment you started playing and was enjoyed by all.


  I hope there will be another occasion when we can enjoy the Band’s music and
  singing.
