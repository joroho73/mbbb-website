reviewer: Gabi & Birgit - Hosts in Germany
review_text: >-
  Our Bavarian towns of Eschenbach and Kemnath cannot stop talking about your
  three performances that got everybody on their feet. 


  We want to have you back in Germany as soon as possible to bring glamour and
  glitter to our forthcoming celebrations. Everybody who heard you, young and
  old, appreciated your music, which came straight from the heart and touched
  our hearts, too.
date: 2008-06-01
source: Private Celebration
