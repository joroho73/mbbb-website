reviewer: Fiona & Steve - Cavalier Caravan Club Rally
review_text: >-
  Highlight of the rally: The Forties Night with the Melvin Beddow Big Band. 


  They were absolutely amazing! Dressed in GI style uniform they played Glen
  Miller – Chattanooga Choochoo, In the Mood, Pennsylvania 65000 and many
  others, some that we did not know, and many that we had heard before. Two
  singers, a man and a woman, sang solos. I cannot remember them all but they
  were exceptionally good. It was absolutely wonderful. We felt privileged to
  hear them perform. A great night!
date: 2010-06-05
