reviewer: Tom Ptolomy - Help For Heroes Charity
review_text: >-
  "It was a complete pleasure when the Melvin Beddow Big Band opened our Help
  For Heroes day. It was a great start to a great day. 


  Twenty two members somehow managed to occupy a very small stage and the sound
  they produced was amazing. Glen Miller would have been proud! This is a band
  which can comfortably carry off any tune blindfolded."
date: 2009-08-01
