reviewer: John Graves - Marillac Hospital
review_text: >-
  On behalf of the Marillac Hospital I would like to thank you for the fabulous
  entertainment you gave us at our recent fundraiser.


  Although we did not enjoy the best of weather the quality of the music the
  band performed really brightened up the evening. It is our intention to hold
  further events in future years and I am sure we will booking the Melvin Beddow
  Big Band again.
date: 2009-07-04
