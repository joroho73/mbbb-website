reviewer: Amanda & Mark
review_text: >-
  We can’t thank you enough for the brilliant job you did at our wedding last
  week, our friends and family were blown away and so were we. I think we’ll all
  be talking about it for many years to come.


  It was a wonderful surprise to see Kate get up and play with you all, I don’t
  think I could’ve done that at 10yrs of age, how kind of you all to accommodate
  her.


  Thank you all again so much, i’m currently trying to think of another excuse
  for a big party so we can all get together to hear you play.
