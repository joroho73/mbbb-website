reviewer: Ray Crick - Theydon Jazz Club
review_text: >-
  "The King’s Oak’s King’s Room can seldom if ever have resounded with so many
  decibels of live music-making as was thrillingly experienced by last night’s
  audience when the Melvin Beddow Big Band made its High Beach debut. 


  Once they’d all emerged from the traffic chaos outside, the 18 musicians, four
  vocalists and one conductor that make up this remarkable ensemble gave us much
  more than sheer volume. 


  In a programme of (mostly) Swing Era favourites – 26 numbers with Glenn Miller
  hits well to the fore – they impressed with the precision of the
  section-playing and the accomplishment of the brief solos. Incidentally, this
  is now the third week in a row we’ve heard Ja-Da, sounding very different each
  time. And for this visit we had a vocal quartet, the “Melvinnaires”, with Mike
  Sullivan shining especially in Sinatra-like tones. 


  Conductor and MC Steve Robinson urged everything along with Jools Holland-ish
  enthusiasm. It had to be said: everyone was well and truly In The Mood by the
  end of the evening."
