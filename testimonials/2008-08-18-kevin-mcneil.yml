reviewer: Kevin McNeil
review_text: …sincere and heartfelt thank you to… Steve Robinson and all the
  members of the band for making my mother’s 80th birthday celebration such a
  success in August this year. Everything on the night went perfectly and the
  performance of the band in the two sets was absolutely first class. We were
  very impressed by the band’s professionalism and the sound was fantastic. We
  received many letters and cards following the party and every one commented on
  “that fantastic Big Band”. We would have no hesitation in recommending The
  Melvin Beddow Big Band to anyone seeking something extra special for their
  function or party.
date: 2008-08-18
