reviewer: Kate & Steve
review_text: >-
  "We just wanted to say a huge huge thank you to the Melvin Beddow Big Band for
  making our special day even more amazing! 


  From the booking stage to the performance, they could not have been more
  helpful, friendly and accommodating. Our guests knew we were having a band
  play at the reception but were unaware that there were going to be 20 of them.
  It was a fantastic suprise and a big talking point for all. We had never been
  to a wedding before where the whole dance floor was full of people within
  minutes, so to have that at ours made it that extra bit special.


  After seeing them perform it is clear to see each band member is extremely
  talented and passionate about what they do and their performance as a band
  would not be out of place at the Royal Albert Hall. If you are thinking of
  booking this band for a function we cannot recommend them enough.


  Thank you Steve and the rest of the band, you were amazing!"
