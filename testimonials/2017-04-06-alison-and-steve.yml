reviewer: Alison & Steve
review_text: We would just like to thank the band for the music they played at
  our wedding on Saturday 6th April 2017. The sound you created was wonderful.
  With special thanks to Andy for re-writing our first dance song enabling us to
  have the song that meant so much to us, to the committee for allowing some of
  our more musically minded-friends to join the band for the final number and
  for the band themselves who were simply the best! So many wonderful memories
  were created that day and we are so pleased that the band are part of them. So
  many friends came up to us on the evening and afterwards to say that they had
  never heard a big band play before and what a fantastic sound you created. It
  was perfect, so please pass on our thanks to the Melvineers, for their time
  and expertise!
