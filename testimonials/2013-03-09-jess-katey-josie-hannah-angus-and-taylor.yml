reviewer: "Jess, Katey, Josie, Hannah, Angus & Taylor "
review_text: >-
  We are just writing to let you know that we are so grateful for your
  generosity to play at our Performing Arts Masquerade Ball. From all the event
  ticket and raffle ticket sales we managed to raise more than £600 for our
  chosen charity, ‘Cry in the Dark’.


  All of the teachers were very impressed with the band, as most of them have
  never attended events like ours before. The students of POST 16 also enjoyed
  the evening more than they expected, because they had never had a chance to be
  involved, listen and dance to music of your genres before.


  Without your contribution, our event wouldn’t have happened. We are so
  grateful for what you have done for us, and as a team we would like to express
  we completely enjoyed the evening; we hope you did too.
date: 2013-03-09
source: Masquerade Ball
