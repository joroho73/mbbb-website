reviewer: Valerie & Eric
review_text: Eric and I cannot thank you enough for helping to make our evening
  so special. The music as usual was fantastic and all our friends and family
  said what a wonderful evening and how they enjoyed dancing or just listening,
  (some have never seen or heard a live band before), and the variety of music
  that you played.
