reviewer: Richard Jenson
review_text: >-
  "The Melvin Beddow Big Band played at my 50th birthday party and were
  absolutely amazing. 


  All my guests were bowled over by their sight and sound, as most had not seen
  a big band live before. It was a fabulous evening and I would personally like
  to thank each and every one of them for making it so special."
