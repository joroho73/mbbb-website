name: Publish CMS content — Bobcat preview

on:
  push:
    branches: [migration/mythic-web-hosting]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mbbb-bobcat-content-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/migration/mythic-web-hosting'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Test content builder
        run: npm run content:test

      - name: Validate and stage published content
        run: |
          mkdir -p .content-build
          npm run content:build -- --stage .content-build/release

      - name: Validate and stage gallery
        run: |
          node scripts/build-gallery.mjs \
            --stage .content-build/gallery-release

      - name: Package content
        run: |
          python3 scripts/package-content.py \
            --content .content-build/release \
            --gallery .content-build/gallery-release \
            --commit "$GITHUB_SHA" \
            --sequence "$((GITHUB_RUN_NUMBER + 1))" \
            --output .content-build/bundle.json

      - name: Check this is still the latest commit
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_sha=$(gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq '.object.sha')

          if [[ "$latest_sha" == "$GITHUB_SHA" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "A newer commit exists. Skipping this publication."
          fi

      - name: Publish through restricted SSH receiver
        if: steps.latest.outputs.publish == 'true'
        env:
          MBBB_SSH_HOST: ${{ secrets.BOBCAT_SSH_HOST }}
          MBBB_SSH_PORT: ${{ secrets.BOBCAT_SSH_PORT }}
          MBBB_SSH_USER: ${{ secrets.BOBCAT_SSH_USER }}
          MBBB_SSH_PRIVATE_KEY: ${{ secrets.BOBCAT_SSH_PRIVATE_KEY }}
          MBBB_SSH_KNOWN_HOSTS: ${{ secrets.BOBCAT_SSH_KNOWN_HOSTS }}
        run: |
          : "${MBBB_SSH_HOST:?Missing MBBB_SSH_HOST}"
          : "${MBBB_SSH_PORT:?Missing MBBB_SSH_PORT}"
          : "${MBBB_SSH_USER:?Missing MBBB_SSH_USER}"
          : "${MBBB_SSH_PRIVATE_KEY:?Missing MBBB_SSH_PRIVATE_KEY}"
          : "${MBBB_SSH_KNOWN_HOSTS:?Missing MBBB_SSH_KNOWN_HOSTS}"

          ssh_dir=$(mktemp -d "$RUNNER_TEMP/mbbb-ssh.XXXXXX")
          trap 'rm -rf -- "$ssh_dir"' EXIT

          printf '%s\n' "$MBBB_SSH_PRIVATE_KEY" \
            > "$ssh_dir/key"
          printf '%s\n' "$MBBB_SSH_KNOWN_HOSTS" \
            > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"

          ssh -F /dev/null -T \
            -i "$ssh_dir/key" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            -p "$MBBB_SSH_PORT" \
            "$MBBB_SSH_USER@$MBBB_SSH_HOST" publish \
            < .content-build/bundle.json

      - name: Verify published content over HTTPS
        if: steps.latest.outputs.publish == 'true'
        run: |
          python3 - <<'PY'
          import base64
          import json
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          bundle = json.loads(
              Path(".content-build/bundle.json").read_text(
                  encoding="utf-8"
              )
          )

          base = "https://mbbb-preview.dcsmail.uk/content"
          expected = f"{bundle['sequence']}-{bundle['commit']}"

          request = Request(
              f"{base}/current.json",
              headers={"Cache-Control": "no-cache"},
          )

          with urlopen(request, timeout=30) as response:
              current = json.load(response)

          if current["release"] != expected:
              raise SystemExit("Unexpected active release")

          expected_files = {
              path: text.encode("utf-8")
              for path, text in bundle["files"].items()
          }

          expected_files.update({
              path: base64.b64decode(encoded, validate=True)
              for path, encoded in bundle["images"].items()
          })

          for path, expected_bytes in expected_files.items():
              url = (
                  f"{base}/releases/{expected}/"
                  f"{quote(path, safe='/')}"
              )

              with urlopen(url, timeout=30) as response:
                  actual = response.read()

              if actual != expected_bytes:
                  raise SystemExit(f"Content mismatch: {path}")

          print(f"Verified release: {expected}")
          print(
              f"All {len(bundle['files'])} text files and "
              f"{len(bundle['images'])} images match."
          )
          PY

      - name: Clean up old releases after verification
        if: steps.latest.outputs.publish == 'true'
        env:
          MBBB_SSH_HOST: ${{ secrets.BOBCAT_SSH_HOST }}
          MBBB_SSH_PORT: ${{ secrets.BOBCAT_SSH_PORT }}
          MBBB_SSH_USER: ${{ secrets.BOBCAT_SSH_USER }}
          MBBB_SSH_PRIVATE_KEY: ${{ secrets.BOBCAT_SSH_PRIVATE_KEY }}
          MBBB_SSH_KNOWN_HOSTS: ${{ secrets.BOBCAT_SSH_KNOWN_HOSTS }}
        run: |
          : "${MBBB_SSH_HOST:?Missing MBBB_SSH_HOST}"
          : "${MBBB_SSH_PORT:?Missing MBBB_SSH_PORT}"
          : "${MBBB_SSH_USER:?Missing MBBB_SSH_USER}"
          : "${MBBB_SSH_PRIVATE_KEY:?Missing MBBB_SSH_PRIVATE_KEY}"
          : "${MBBB_SSH_KNOWN_HOSTS:?Missing MBBB_SSH_KNOWN_HOSTS}"

          ssh_dir=$(mktemp -d "$RUNNER_TEMP/mbbb-ssh.XXXXXX")
          trap 'rm -rf -- "$ssh_dir"' EXIT

          printf '%s\n' "$MBBB_SSH_PRIVATE_KEY" \
            > "$ssh_dir/key"
          printf '%s\n' "$MBBB_SSH_KNOWN_HOSTS" \
            > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"

          ssh -F /dev/null -T \
            -i "$ssh_dir/key" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            -p "$MBBB_SSH_PORT" \
            "$MBBB_SSH_USER@$MBBB_SSH_HOST" \
            "cleanup $((GITHUB_RUN_NUMBER + 1))-$GITHUB_SHA"

