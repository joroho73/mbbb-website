name: Publish CMS content — Bobcat preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mbbb-bobcat-content-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Test content builder
        run: npm run content:test

      - name: Validate and stage published content
        run: |
          mkdir -p .content-build
          npm run content:build -- --stage .content-build/release

      - name: Validate and stage gallery
        run: |
          node scripts/build-gallery.mjs \
            --stage .content-build/gallery-release

      - name: Package content
        run: |
          python3 scripts/package-content.py \
            --content .content-build/release \
            --gallery .content-build/gallery-release \
            --commit "$GITHUB_SHA" \
            --sequence "$((GITHUB_RUN_NUMBER + 1))" \
            --output .content-build/bundle.json

      - name: Check this is still the latest commit
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_sha=$(gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" \
            --jq '.object.sha')

          if [[ "$latest_sha" == "$GITHUB_SHA" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "A newer commit exists. Skipping this publication."
          fi

      - name: Publish content to Bobcat and clean up old releases
        if: steps.latest.outputs.publish == 'true'
        env:
          SSH_HOST: ${{ secrets.BOBCAT_SSH_HOST }}
          SSH_PORT: ${{ secrets.BOBCAT_SSH_PORT }}
          SSH_USER: ${{ secrets.BOBCAT_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.BOBCAT_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.BOBCAT_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077

          ssh_dir=$(mktemp -d "$RUNNER_TEMP/mbbb-ssh.XXXXXX")
          trap 'rm -rf -- "$ssh_dir"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$ssh_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"

          bobcat() {
            ssh -F /dev/null -T \
              -i "$ssh_dir/key" \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$ssh_dir/known_hosts" \
              -o ConnectTimeout=20 \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=3 \
              -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "$@"
          }

          release="$((GITHUB_RUN_NUMBER + 1))-$GITHUB_SHA"
          bobcat publish < .content-build/bundle.json
          bobcat "cleanup $release"